project:
  type: website
  output-dir: _site
  resources:
    - "assets/**"     # <-- CRITICAL: Forces Quarto to copy your asset directory completely to _site/assets/
  render:
    - "*.qmd"
    - "blog/**/*.qmd"      # Recursively catches blog/index.qmd and blog/posts/*.qmd
    - "knowledge/**/*.qmd" # Recursively 
    - "slides/**/*.qmd"    # Add this line
    - "!brain"             # Explicitly invite the clean concept notes
    - "!.obsidian/"        # Strictly excludes the Obsidian configuration tracking folder
    - "!lint_wiki.py"      # Explicitly excludes the Gemini python automation engine script

website:
  title: "LLM-wiki Footprints"
  description: "Socio-Technical Research Hub: A human-supervised knowledge base and agentic portfolio."
  site-url: "https://llm-wiki.footprints.cv/"

  # This section generates targeted navbar styles
  navbar:
    logo: /assets/brand/footprints.cv.svg
    background: dark        # Injects the "bg-dark" class
    type: dark              # Injects the "data-bs-theme=dark" context
    search: true            # Compiles the "d-flex" search box on the right side
    left:
      - href: knowledge/index.qmd
        text: LLM-wiki
      - href: blog/index.qmd
        text: "Notes"
      - href: slides/index.qmd
        text: "Slides"
      - href: about.qmd
        text: "What it is"

format:
  html:
    theme:
      light:
        - zephyr
        - style-shared.scss
        - brand
      dark:
        - zephyr 
        - style-shared.scss
        - style-zephyr-dark.scss
        - brand    
    css: styles.css
    toc: true
